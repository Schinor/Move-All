services:
  postgres:
    image: postgres:16-alpine
    container_name: move-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-move}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-move}
      POSTGRES_DB: ${POSTGRES_DB:-move_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Move-Intelligence-Back/prisma/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-move} -d ${POSTGRES_DB:-move_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: move-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Move-Intelligence-Back/Dockerfile
    container_name: move-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      RUN_DB_PUSH_ON_BOOT: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-move}:${POSTGRES_PASSWORD:-move}@postgres:5432/${POSTGRES_DB:-move_intelligence}?schema=public
      MOVE_ETL_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-move}:${POSTGRES_PASSWORD:-move}@postgres:5432/${POSTGRES_DB:-move_intelligence}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-move_jwt_super_secret_key_change_in_production}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-inclusionai/ling-3.0-flash-fin:free}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:4200}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-Move Intelligence}
      BRIGHTDATA_MCP_URL: ${BRIGHTDATA_MCP_URL:-}
      # Coleta real (plano de coleta real): tudo desligado por padrão no ambiente local.
      FICHA_ENABLED: ${FICHA_ENABLED:-false}
      TRACK_LISTINGS_CRON_ENABLED: ${TRACK_LISTINGS_CRON_ENABLED:-false}
      RADAR_DISCOVERY_ENABLED: ${RADAR_DISCOVERY_ENABLED:-false}
      SEARCH_TRENDS_CRON_ENABLED: ${SEARCH_TRENDS_CRON_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Move-Intelligence-Front/Dockerfile
    container_name: move-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  # Container pré-formatado para rodar a coleta histórica de 2 anos uma única vez
  collector-init:
    build:
      context: .
      dockerfile: Move-Intelligence-Dados/Dockerfile
    container_name: move-collector-init
    restart: "no"
    environment:
      MOVE_ETL_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-move}:${POSTGRES_PASSWORD:-move}@postgres:5432/${POSTGRES_DB:-move_intelligence}
      COLLECTION_PERIOD_YEARS: ${COLLECTION_PERIOD_YEARS:-2}
      BRIGHTDATA_MCP_URL: ${BRIGHTDATA_MCP_URL:-}
    command: ["python3", "main.py", "--pipeline", "historical-collection", "--period-years", "2"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # Agendador / Timer contínuo de varredura periódica do catálogo
  collector-scheduler:
    build:
      context: .
      dockerfile: Move-Intelligence-Dados/Dockerfile
    container_name: move-collector-scheduler
    restart: unless-stopped
    environment:
      MOVE_ETL_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-move}:${POSTGRES_PASSWORD:-move}@postgres:5432/${POSTGRES_DB:-move_intelligence}
      SCHEDULE_INTERVAL_HOURS: ${SCHEDULE_INTERVAL_HOURS:-168}
      RUN_INIT_ON_STARTUP: "false"
      COLLECTION_PERIOD_YEARS: ${COLLECTION_PERIOD_YEARS:-2}
      BRIGHTDATA_MCP_URL: ${BRIGHTDATA_MCP_URL:-}
    command: ["python3", "scripts/collector_scheduler.py"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
