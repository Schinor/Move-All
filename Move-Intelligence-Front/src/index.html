<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Move Intelligence — Rastreador de Tendências e Decisão de Lançamento</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plataforma da Move para identificar tendências emergentes, avaliar risco e decidir lançamentos com confiança.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <script>
    try {
      const savedTheme = localStorage.getItem('move:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (_) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
