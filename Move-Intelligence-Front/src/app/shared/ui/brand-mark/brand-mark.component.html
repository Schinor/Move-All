<svg
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.viewBox]="viewBox"
  fill="currentColor"
  xmlns="http://www.w3.org/2000/svg"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label()"
  [attr.aria-hidden]="label() ? null : 'true'"
  focusable="false"
>
  @if (label()) {
    <title>{{ label() }}</title>
  }
  <path [attr.d]="path" />
</svg>
