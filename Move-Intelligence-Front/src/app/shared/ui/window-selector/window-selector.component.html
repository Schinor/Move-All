<div class="window-selector" role="group" aria-label="Janela temporal">
  @for (w of windows; track w) {
    <button
      type="button"
      class="opt"
      [class.active]="w === value()"
      [attr.aria-pressed]="w === value()"
      (click)="changed.emit(w)"
    >
      {{ w }}
    </button>
  }
</div>
