<aside id="app-navigation" class="sidebar" aria-label="Navegação principal">
  <a class="brand" routerLink="/" (click)="closeOnCompact()" aria-label="Ir para o Executivo">
    <app-brand-lockup class="brand-full" />
    <app-brand-mark class="brand-rail" [size]="24" />
  </a>

  <nav class="nav" aria-label="Módulos">
    @for (group of groups; track group.label) {
      <section class="nav-group" [attr.aria-labelledby]="'nav-' + group.label">
        <h2 class="section-label" [id]="'nav-' + group.label">{{ group.label }}</h2>
        <ul>
          @for (item of group.items; track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: !!item.exact }"
                [ariaCurrentWhenActive]="'page'"
                (click)="closeOnCompact()"
                [attr.title]="item.label + (item.soon ? ' — em breve' : '')"
                [attr.aria-label]="item.label + (item.soon ? ', em breve' : '')"
              >
                <app-icon class="nav-icon" [name]="item.icon" [size]="18" />
                <span class="nav-label">{{ item.label }}</span>
                @if (item.soon) {
                  <span class="soon">em breve</span>
                }
              </a>
            </li>
          }
        </ul>
      </section>
    }
  </nav>
</aside>
