<aside id="app-navigation" class="sidebar" aria-label="Navegação principal">
  <div class="brand">
    <a
      class="brand-link"
      [routerLink]="layout.sidebarOpen() ? '/' : null"
      (click)="brandClick($event)"
      [attr.aria-label]="layout.sidebarOpen() ? 'Ir para o Executivo' : 'Abrir barra lateral'"
    >
      <app-brand-lockup class="brand-full" />
      <span class="brand-rail-wrap">
        <app-brand-mark class="brand-rail" [size]="24" />
        <app-icon class="brand-open" name="panel-left" [size]="20" />
      </span>
    </a>
    <div class="brand-side">
      <button
        type="button"
        class="icon-btn brand-close"
        (click)="layout.closeSidebar()"
        aria-label="Fechar barra lateral"
        title="Fechar barra lateral"
      >
        <app-icon name="panel-left-close" [size]="17" />
      </button>
    </div>
  </div>

  <nav class="nav" aria-label="Módulos">
    @for (group of visibleGroups(); track group.label) {
      <section class="nav-group" [attr.aria-labelledby]="'nav-' + group.label">
        <h2 class="section-label" [id]="'nav-' + group.label">{{ group.label }}</h2>
        <ul>
          @for (item of group.items; track item.path) {
            <li class="nav-item">
              <a
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: !!item.exact }"
                [ariaCurrentWhenActive]="'page'"
                (click)="closeOnCompact()"
                [attr.aria-label]="item.label + (item.soon ? ', em breve' : '')"
              >
                @if (item.brandMark) {
                  <app-mai-mark class="nav-mai" [size]="13" [accent]="true" />
                  <span class="nav-label">Copilot</span>
                } @else if (item.image) {
                  <img class="nav-icon nav-art" [src]="item.image" alt="" width="24" height="24" />
                  <span class="nav-label">{{ item.label }}</span>
                } @else {
                  <app-icon class="nav-icon" [name]="item.icon" [size]="18" />
                  <span class="nav-label">{{ item.label }}</span>
                }
                @if (item.soon) {
                  <span class="soon">em breve</span>
                }
              </a>
            </li>
          }
        </ul>
      </section>
    }
  </nav>
</aside>
