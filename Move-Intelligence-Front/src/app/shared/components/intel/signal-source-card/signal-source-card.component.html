<article class="sources surface-panel">
  <header>
    <span>Fontes de dados</span>
    <strong>{{ sources().length }}</strong>
  </header>

  <ul>
    @for (source of sources(); track source.source) {
      <li>
        <span class="dot" [class.on]="source.online"></span>
        <span class="name">{{ source.source }}</span>
        <span class="status">{{ source.online ? 'ativa' : 'offline' }}</span>
      </li>
    }
  </ul>
</article>
