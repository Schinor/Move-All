<article class="matrix surface-panel">
  <header>
    <span>Move Score x confiança</span>
    <strong>{{ products().length }} oportunidades</strong>
  </header>

  <div class="grid" role="table">
    @for (cell of cells(); track cell.scoreBand + cell.confidence) {
      <div class="cell" role="cell">
        <span class="axis">{{ cell.scoreBand }} · {{ cell.confidence }}</span>
        <div class="chips">
          @for (item of cell.items; track item.productClusterId) {
            <a [routerLink]="['/tendencia', item.productClusterId]" class="chip">
              {{ item.canonicalName }}
            </a>
          }
          @if (!cell.items.length) {
            <span class="empty">—</span>
          }
        </div>
      </div>
    }
  </div>
</article>
