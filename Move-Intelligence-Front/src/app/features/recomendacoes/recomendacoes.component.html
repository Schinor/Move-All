<app-page-header
  title="Recomendações"
  subtitle="Converta sinais em ações de comprar, monitorar, negociar ou bloquear quando o motor estiver pronto."
/>

<section class="development-panel" aria-labelledby="recommendations-development-title">
  <span class="development-icon"><app-icon name="lightbulb" [size]="22" /></span>
  <span class="status-label">Em desenvolvimento</span>
  <h2 id="recommendations-development-title">As recomendações ainda não estão conectadas</h2>
  <p>
    O módulo vai apresentar ações explicáveis a partir dos dados reais do catálogo. Nenhuma ação é
    sugerida enquanto esse motor não estiver disponível.
  </p>
  <a routerLink="/sinais" class="interim-link">Acompanhar sinais e alertas <app-icon name="arrow-right" [size]="15" /></a>
</section>
